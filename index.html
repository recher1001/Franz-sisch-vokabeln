<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Vokabeltrainer À plus! 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..800&family=Playwrite+FR+Moderne:wght@100..400&display=swap">
<style>
/* Layout: ein französisches Schulheft. Die Startseite ist der Heftdeckel (königsblau, mit Etikett),
   dahinter kommen Seite für Seite: Vokabeln wählen, Lernart wählen, Einstellungen, Lernen.
   Lernkarten tragen die Seyès-Lineatur, die Rückmeldung kommt in Schreibschrift wie vom Korrekturstift.
   Jede Lernart hat ihre eigene Farbe, wie Registerblätter. Dunkel wird das Heft zur Tafel. Eine schmale Spalte. */
:root{
  --bg:#eceef8; --paper:#ffffff; --ink:#1b2250; --ink2:#555d8a; --rule:#cdd2f0; --rule2:#e9ebf8; --marge:#e23d57;
  --accent:#2a3bd0; --on-accent:#ffffff; --accent-soft:#e1e5ff;
  --cover:#2536c9; --cover2:#3446d8; --on-cover:#ffffff; --on-cover2:#cfd5ff; --cta:#ffd45e; --on-cta:#1b2250;
  --good:#0b7f54; --good-soft:#dcf3e8; --bad:#c9233f; --bad-soft:#fde3e8; --warn:#9a5700; --warn-soft:#fbebcd;
  --k1:#2a3bd0; --k2:#d92f4b; --k3:#0b8f63; --k4:#b96c00; --k5:#7a4be0; --k6:#0b879f; --k7:#d2470f; --k8:#ad3089; --on-k:#ffffff;
  --shadow:0 1px 0 rgba(27,34,80,.06),0 14px 32px -16px rgba(27,34,80,.32);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-hand:"Playwrite FR Moderne","Segoe Script","Bradley Hand","Snell Roundhand",cursive;
  --r:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12201c; --paper:#1a2d28; --ink:#eef3e8; --ink2:#a4b7ab; --rule:#30504a; --rule2:#223a34; --marge:#ff8496;
  --accent:#ffd45e; --on-accent:#1e2710; --accent-soft:#394630;
  --cover:#0c1714; --cover2:#16271f; --on-cover:#eef3e8; --on-cover2:#a4b7ab; --cta:#ffd45e; --on-cta:#1e2710;
  --good:#7fe3ac; --good-soft:#1e4335; --bad:#ff93a0; --bad-soft:#4a2630; --warn:#ffc46b; --warn-soft:#45391f;
  --k1:#9aa8ff; --k2:#ff8496; --k3:#7fe3ac; --k4:#ffd45e; --k5:#c6adff; --k6:#7fd8ea; --k7:#ffa377; --k8:#f29ad6; --on-k:#12201c;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 32px -16px rgba(0,0,0,.7);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12201c; --paper:#1a2d28; --ink:#eef3e8; --ink2:#a4b7ab; --rule:#30504a; --rule2:#223a34; --marge:#ff8496;
  --accent:#ffd45e; --on-accent:#1e2710; --accent-soft:#394630;
  --cover:#0c1714; --cover2:#16271f; --on-cover:#eef3e8; --on-cover2:#a4b7ab; --cta:#ffd45e; --on-cta:#1e2710;
  --good:#7fe3ac; --good-soft:#1e4335; --bad:#ff93a0; --bad-soft:#4a2630; --warn:#ffc46b; --warn-soft:#45391f;
  --k1:#9aa8ff; --k2:#ff8496; --k3:#7fe3ac; --k4:#ffd45e; --k5:#c6adff; --k6:#7fd8ea; --k7:#ffa377; --k8:#f29ad6; --on-k:#12201c;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 32px -16px rgba(0,0,0,.7);
  color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;transition:background-color .25s}
body.deckel{background:var(--cover)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.12;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.deckel :focus-visible{outline-color:var(--cta)}

.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top:empty{display:none}
.titel{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.titel b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.titel span{font-size:.8rem;color:var(--ink2)}
.nav{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--rule);
  background:transparent;font-weight:650;font-size:.92rem;flex:none}
.nav:hover{border-color:var(--accent)}
main{display:flex;flex-direction:column;gap:20px;flex:1;min-width:0}
main.blatt{animation:blatt .26s ease-out}
@keyframes blatt{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- Bausteine ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;
  border:1.5px solid var(--rule);background:var(--paper);font-weight:700;font-size:1rem;text-align:center}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.gut{background:var(--good);border-color:var(--good);color:var(--paper)}
.btn.schlecht{border-color:var(--bad);color:var(--bad)}
.btn.klein{min-height:44px;padding:0 14px;font-size:.92rem;border-radius:12px}
.btn.gross{min-height:60px;font-size:1.1rem;flex-direction:column;gap:1px;width:100%}
.btn small{font-weight:600;font-size:.82rem;opacity:.9}
.btn:disabled{opacity:.5;cursor:default}
.btn:not(:disabled):active{transform:translateY(1px)}
.aktionen{display:flex;gap:10px;flex-wrap:wrap}
.aktionen .btn{flex:1 1 140px}
.fuss{position:sticky;bottom:0;z-index:5;margin-inline:-6px;padding:14px 6px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.fuss .btn{box-shadow:var(--shadow)}
.spk{display:none;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:50%;
  border:1.5px solid var(--rule);background:var(--paper);color:var(--accent);vertical-align:middle}
.kann-sprechen .spk{display:inline-flex}
.hand{font-family:var(--f-hand);font-weight:400}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.hinweis{font-size:.88rem;color:var(--ink2);max-width:62ch}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:750;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.badge.neu{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.faellig{background:var(--bad-soft);color:var(--bad)}
.seyes{background-color:var(--paper);background-image:
  linear-gradient(90deg,transparent 1.75rem,var(--marge) 1.75rem,var(--marge) calc(1.75rem + 1.5px),transparent calc(1.75rem + 1.5px)),
  repeating-linear-gradient(0deg,var(--rule) 0,var(--rule) 1px,transparent 1px,transparent 2rem),
  repeating-linear-gradient(0deg,var(--rule2) 0,var(--rule2) 1px,transparent 1px,transparent .5rem),
  repeating-linear-gradient(90deg,var(--rule2) 0,var(--rule2) 1px,transparent 1px,transparent 2rem)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:14px;background:var(--rule2);border:1px solid var(--rule)}
.seg button{min-height:42px;padding:0 14px;border-radius:10px;border:0;background:transparent;font-weight:650;font-size:.92rem;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.pips{display:inline-flex;gap:4px;align-items:center}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink2)}
.pips i.an{background:var(--accent);border-color:var(--accent)}
.pips.fertig i{background:var(--good);border-color:var(--good)}
.schritte{display:flex;gap:6px;align-items:center;list-style:none;margin:0;padding:0;font-size:.8rem;font-weight:700;color:var(--ink2)}
.schritte li{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.schritte li::after{content:"";flex:1;height:2px;background:var(--rule);border-radius:2px}
.schritte li:last-child{flex:none}
.schritte li:last-child::after{display:none}
.schritte i{font-style:normal;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--rule);flex:none;font-variant-numeric:tabular-nums}
.schritte .da{color:var(--ink)}
.schritte .da i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.schritte .war i{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.schritte span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopf h1{font-size:clamp(1.55rem,6.4vw,2rem);font-weight:800}
.kopf{display:flex;flex-direction:column;gap:6px}
.kopf p{color:var(--ink2)}

/* ---------- Deckel (Start) ---------- */
.deckel .app{color:var(--on-cover)}
.cover{display:flex;flex-direction:column;gap:22px;flex:1}
.cover-nav{display:flex;justify-content:flex-end;gap:8px}
.cover-nav .nav{border-color:var(--cover2);background:var(--cover2);color:var(--on-cover)}
.etikett{align-self:center;width:min(100%,430px);border-radius:14px;padding:6px;background:var(--paper);box-shadow:var(--shadow);transform:rotate(-1.2deg)}
.etikett-in{border:2px solid var(--marge);border-radius:9px;padding:14px 18px 16px;display:flex;flex-direction:column;gap:2px;color:var(--ink);
  background-image:repeating-linear-gradient(0deg,transparent 0,transparent calc(2.25rem - 1px),var(--rule) calc(2.25rem - 1px),var(--rule) 2.25rem);background-position:0 .5rem}
.etikett .eyebrow{line-height:2.25rem}
.etikett .hand{font-size:clamp(1.7rem,8vw,2.3rem);line-height:2.25rem;color:var(--accent);white-space:nowrap}
.etikett .zeile{font-family:var(--f-display);font-weight:750;font-size:1.02rem;line-height:2.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gruss{display:flex;flex-direction:column;gap:8px}
.gruss .hand{font-size:1.35rem;color:var(--cta)}
.gruss h1{font-size:clamp(1.7rem,7vw,2.4rem);font-weight:800}
.gruss h1 em{font-style:normal;color:var(--cta)}
.cover .btn.cta{background:var(--cta);border-color:var(--cta);color:var(--on-cta);min-height:64px;font-size:1.2rem;width:100%;box-shadow:var(--shadow)}
.cover .btn.zweit{background:transparent;border-color:var(--on-cover2);color:var(--on-cover);width:100%}
.cover-knopf{display:flex;flex-direction:column;gap:10px}
.zahlen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zahl{border-radius:14px;background:var(--cover2);padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.zahl b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.zahl span{font-size:.76rem;color:var(--on-cover2);font-weight:600}
.kasten-wrap{display:flex;flex-direction:column;gap:10px}
.kasten{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;padding:14px 10px 10px;border-radius:var(--r);
  background:var(--paper);border:1.5px solid var(--rule);color:var(--ink)}
.fach{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.fach-n{font-family:var(--f-display);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1}
.fach-n.null{color:var(--ink2);opacity:.55}
.stapel{width:100%;height:70px;display:flex;flex-direction:column-reverse;gap:2px;padding:4px 4px 0;border-radius:6px 6px 0 0;
  border:1.5px solid var(--rule);border-bottom-width:4px;background:var(--rule2)}
.stapel i{height:5px;border-radius:2px;background:var(--ink2);opacity:.45}
.stapel i.f{background:var(--marge);opacity:1}
.stapel.ziel i{background:var(--good);opacity:.9}
.fach-l{font-size:.7rem;font-weight:700;color:var(--ink2);letter-spacing:.02em;white-space:nowrap}
.legende{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.8rem;color:var(--ink2)}
.deckel .legende,.deckel .kasten-wrap>.eyebrow{color:var(--on-cover2)}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{width:14px;height:5px;border-radius:2px;background:currentColor;opacity:.6}
.legende i.f{background:var(--marge);opacity:1}
.legende i.z{background:var(--good);opacity:1}
.deckel .legende i.z{background:var(--cta)}

/* ---------- Schritt 1: Auswahl ---------- */
.gruppe{display:flex;flex-direction:column;gap:8px}
.gruppe-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gruppe-kopf h2{font-size:1.1rem;font-weight:750}
.link{border:0;background:none;padding:10px 4px;color:var(--accent);font-weight:700;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.volet{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:12px 14px;border-radius:14px;
  border:1.5px solid var(--rule);background:var(--paper);cursor:pointer}
.volet input{position:absolute;opacity:0;width:1px;height:1px}
.haken{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;color:transparent;grid-row:1 / span 2}
.volet input:checked ~ .haken{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.volet input:focus-visible ~ .haken{outline:3px solid var(--accent);outline-offset:2px}
.volet:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.volet-name{font-weight:750;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.volet-meta{font-size:.84rem;color:var(--ink2);grid-column:2}
.volet-zahl{grid-column:3;grid-row:1 / span 2;text-align:right;font-size:.8rem;color:var(--ink2);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.balken{display:flex;width:64px;height:7px;border-radius:4px;overflow:hidden;background:var(--rule2);border:1px solid var(--rule)}
.balken i{display:block;height:100%}
.balken .b1{background:var(--accent)} .balken .b2{background:var(--good)}
.schnell{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Schritt 2: Lernart ---------- */
.arten{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.art{--k:var(--k1);display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:14px;border-radius:18px;border:1.5px solid var(--rule);
  background:var(--paper);min-width:0;position:relative;overflow:hidden}
.art::after{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--k)}
.art:not(:disabled):hover{border-color:var(--k)}
.art .bild{width:46px;height:46px;border-radius:14px;background:var(--k);color:var(--on-k);display:flex;align-items:center;justify-content:center;flex:none}
.art b{font-family:var(--f-display);font-size:1.12rem;font-weight:750;line-height:1.15;color:var(--ink)}
.art span{font-size:.86rem;color:var(--ink2);line-height:1.35}
.art.breit{grid-column:1 / -1;flex-direction:row;align-items:center;gap:14px;padding:18px 16px}
.art.breit .text{display:flex;flex-direction:column;gap:4px;min-width:0}
.art.breit .bild{width:56px;height:56px;border-radius:16px}
.art:disabled{opacity:.55;cursor:default}
.art .zeile{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- Schritt 3: Einstellungen ---------- */
.opt-zeile{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--rule)}
.opt-zeile:last-child{border-bottom:0}
.opt-zeile b{font-weight:700;display:block}
.opt-zeile small{color:var(--ink2);font-size:.86rem}
.wie{border-radius:var(--r);padding:16px 18px 16px 2.6rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.wie p{font-size:.98rem}

/* ---------- Lernen ---------- */
.runde{display:flex;flex-direction:column;gap:16px;width:100%}
.fortschritt{display:flex;align-items:center;gap:12px}
.fortschritt .spur{flex:1;height:10px;border-radius:6px;background:var(--rule2);border:1px solid var(--rule);overflow:hidden}
.fortschritt .spur i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.fortschritt span{font-size:.86rem;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.karte{border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px 20px 2.6rem;display:flex;flex-direction:column;gap:12px;min-width:0}
.karte.rein{animation:rein .28s ease-out}
@keyframes rein{from{opacity:.2;transform:translateY(10px) rotate(-.6deg)}to{opacity:1;transform:none}}
.k-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:1.5rem}
.k-sec{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.k-frage{font-size:.92rem;color:var(--ink2);font-weight:600}
.k-wort{font-family:var(--f-display);font-weight:750;font-size:clamp(1.5rem,6.4vw,2.1rem);line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.k-wort.lang{font-size:clamp(1.15rem,4.6vw,1.45rem);font-weight:650}
.k-zeile{display:flex;align-items:center;gap:12px}
.k-zeile .k-wort{flex:1;min-width:0}
.k-neben{font-size:1.08rem;overflow-wrap:anywhere}
.k-satz{font-size:1rem;color:var(--ink2);overflow-wrap:anywhere}
.k-satz b{color:var(--ink);font-weight:750}
.k-satz .luecke{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--accent);text-align:center;color:var(--accent);font-weight:750}
.hoer{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;min-height:56px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700}
.eingabe{display:flex;flex-direction:column;gap:10px}
.eingabe input[type=text]{width:100%;min-height:56px;padding:0 16px;border-radius:14px;border:2px solid var(--ink2);background:var(--paper);
  font-size:1.2rem;font-weight:600}
.eingabe input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.akzente{display:flex;flex-wrap:wrap;gap:6px}
.akzente button{min-width:40px;height:44px;padding:0 6px;border-radius:10px;border:1.5px solid var(--rule);background:var(--paper);font-size:1.1rem;font-weight:650}
.urteil{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.stempel{font-family:var(--f-hand);font-size:1.6rem;line-height:1.4;transform:rotate(-3deg);transform-origin:left center;align-self:flex-start;animation:stempel .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes stempel{from{opacity:0;transform:rotate(-9deg) scale(1.5)}to{opacity:1;transform:rotate(-3deg)}}
.stempel.ok{color:var(--good)} .stempel.fast{color:var(--warn)} .stempel.nein{color:var(--bad)}
.erkl{font-size:.92rem;font-weight:650}
.erkl.fast{color:var(--warn)} .erkl.nein{color:var(--bad)} .erkl.leise{color:var(--ink2)}
.deins{font-size:.98rem;color:var(--ink2)}
.deins s{color:var(--bad);text-decoration-thickness:2px}
.weg{font-size:.86rem;font-weight:650;color:var(--ink2)}
.ende{align-items:flex-start}
.ende .hand{font-size:1.6rem;color:var(--accent);line-height:2rem}
.ende h1{font-size:clamp(1.5rem,6vw,2rem);font-weight:800}
.note{display:flex;align-items:center;gap:16px}
.note b{font-family:var(--f-hand);font-weight:400;font-size:3.2rem;line-height:1;color:var(--bad);width:84px;height:84px;border:3px solid var(--bad);border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);flex:none}
.note.gut b{color:var(--good);border-color:var(--good)}
.fehlt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;width:100%}
.fehlt li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:9px 0;border-bottom:1px dashed var(--rule)}
.fehlt li:last-child{border-bottom:0}
.fehlt .m{grid-row:1 / span 3;font-weight:800;width:1.6rem}
.fehlt .m.ok{color:var(--good)} .fehlt .m.fast{color:var(--warn)} .fehlt .m.nein{color:var(--bad)}
.fehlt b{font-weight:750;overflow-wrap:anywhere}
.fehlt span{color:var(--ink2);overflow-wrap:anywhere}
.fehlt s{color:var(--bad)}
#konfetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* ---------- Üben ---------- */
.flip{perspective:1200px;cursor:pointer;border-radius:var(--r);display:block;width:100%}
.flip-in{position:relative;display:grid;transition:transform .45s;transform-style:preserve-3d}
.flip-in.um{transform:rotateY(180deg)}
.seite{grid-area:1 / 1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:230px;justify-content:center}
.seite.hinten{transform:rotateY(180deg)}
.tipp{font-size:.82rem;color:var(--ink2);text-align:center}
.optionen{display:grid;gap:10px}
.opt{min-height:54px;padding:10px 16px;border-radius:14px;border:1.5px solid var(--rule);background:var(--paper);text-align:left;font-weight:600;font-size:1rem;overflow-wrap:anywhere}
.opt.richtig{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.falsch{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.paare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.paar{min-height:62px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--rule);background:var(--paper);font-weight:600;font-size:.92rem;line-height:1.25;overflow-wrap:anywhere;hyphens:auto}
.paar.fr{font-family:var(--f-display);font-weight:700}
.paar[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.paar.weg{opacity:.28;border-style:dashed;background:transparent}
.paar.zitter{animation:zitter .3s;border-color:var(--bad)}
@keyframes zitter{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.punkte{font-weight:700;color:var(--ink2);font-size:.9rem;font-variant-numeric:tabular-nums}

/* ---------- Liste ---------- */
.werkzeug{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.feld{min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--rule);background:var(--paper);width:100%}
.werkzeug .feld{flex:1 1 200px;width:auto}
textarea.feld{padding:10px 14px;min-height:92px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all}
.liste{display:flex;flex-direction:column;gap:18px}
.liste h3{font-size:1rem;font-weight:750;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.liste section{display:flex;flex-direction:column;gap:8px}
.zeilen{border-radius:14px;border:1.5px solid var(--rule);background:var(--paper);overflow:hidden}
.zeile{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--rule2)}
.zeile:last-child{border-bottom:0}
.zeile .fr{font-weight:700;overflow-wrap:anywhere}
.zeile .de{color:var(--ink2);overflow-wrap:anywhere;hyphens:auto}
.zeile .rand{display:flex;align-items:center;gap:8px}
.zeile .spk{width:38px;height:38px}
.deck-fr .zeile:not(.auf) .fr,.deck-de .zeile:not(.auf) .de{color:transparent;border-radius:6px;cursor:pointer;user-select:none;
  background:repeating-linear-gradient(135deg,var(--rule) 0 6px,var(--rule2) 6px 12px)}
.deck-fr .zeile,.deck-de .zeile{cursor:pointer}
@media (max-width:520px){ .zeile{grid-template-columns:minmax(0,1fr) auto} .zeile .de{grid-column:1} .zeile .rand{grid-column:2;grid-row:1 / span 2} }

/* ---------- Mehr ---------- */
.mehr{display:flex;flex-direction:column;gap:26px}
.block{display:flex;flex-direction:column;gap:12px}
.block>h2{font-size:1.25rem;font-weight:750}
.form{display:grid;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:650;color:var(--ink2)}
.eigene{list-style:none;margin:0;padding:0}
.eigene li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--rule)}
.eigene li>span{min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:min(92vw,420px);
  padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:650;font-size:.94rem;box-shadow:var(--shadow);text-align:center}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* Französische Antwort prüfen: 'ok' | 'acc' (nur Akzente falsch) | 'art' (nur Artikel falsch) | 'no' */
function check1(i, L){
  var k;
  for (k=0;k<L.length;k++) if (i === L[k] || i === noArt(L[k])) return 'ok';
  var ia = noAcc(i);
  for (k=0;k<L.length;k++) if (ia === noAcc(L[k]) || ia === noAcc(noArt(L[k]))) return 'acc';
  var ib = noAcc(noArt(i));
  for (k=0;k<L.length;k++) if (ib === noAcc(noArt(L[k]))) return 'art';
  return 'no';
}
function check(input, list){
  var i = norm(input); if (!i) return 'no';
  var L = list.map(norm), r = check1(i, L);
  if (r !== 'no') return r;
  var teile = i.split(/\s*[,\/]\s*/).filter(Boolean);       // "blond, blonde" zählt auch
  if (teile.length < 2) return 'no';
  var rs = teile.map(function(t){ return check1(t, L); });
  if (rs.indexOf('no') >= 0) return 'no';
  return rs.indexOf('art') >= 0 ? 'art' : rs.indexOf('acc') >= 0 ? 'acc' : 'ok';
}
/* Aus "le mot / les mots (m.)" die erlaubten Schreibweisen ableiten */
function variants(fr){
  var base = fr.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  var out = [base];
  base.split(/\s*[,;]\s*|\s+\/\s+|\s+ou\s+/).forEach(function(p){ if (p) out.push(p); });
  out.slice().forEach(function(p){
    if (/^\S+\/\S+$/.test(p) && !/(^|\/)(qn|qc)(\/|$)/.test(p)) p.split('/').forEach(function(x){ if (x.length > 2) out.push(x); });
    var q = p.replace(/\s+((à|de|sur|pour|avec|en)\s+)?(qn\/qc|qc\/qn|qn|qc)(\s.*)?$/,'').trim();
    if (q && q !== p) out.push(q);
    var q1 = p.replace(/\s+(qn\/qc|qc\/qn|qn|qc)$/,'').trim();
    if (q1 && q1 !== p) out.push(q1);

  return einmal(out.map(norm));
}
/* Deutsche Antwort prüfen (für Französisch → Deutsch): großzügig, Artikel und "etw./jdn" egal */
function normDe(s){ return String(s).toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
  .replace(/\b(jdn|jdm|jemanden|jemandem|jemand|etw|etwas)\b\.?/g,' ').replace(/[\/.!?…:;"„“”=]/g,' ').replace(/-/g,'')
  .replace(/^\s*(der|die|das|ein|eine|einen|einem|einer)\s+/,'').replace(/\s+/g,' ').trim(); }
function deTeile(de){
  var out = [];
  [de.replace(/\([^)]*\)/g,' '), de.replace(/[()]/g,'')].forEach(function(b){
    out.push(b);
    b.split(/[,;]|\s\/\s/).forEach(function(p){
      p = p.replace(/^\s*(hier|auch|wörtlich|wörtl\.)\s*:\s*/i,'').replace(/^\s*schweizerisch für\s+/i,'').replace(/\s*\+\s*[A-Za-zÄÖÜäöü]+\.?\s*$/,'').replace(/^\s*der\/die\s+/i,'').trim();
      if (!p) return;
      var m = /^(.*\S)\/in$/.exec(p);
      if (m){ out.push(m[1], m[1] + 'in'); return; }
      if (/^\S+(\/\S+)+$/.test(p) && !/etw|jd[nm]/.test(p)){ p.split('/').forEach(function(x){ out.push(x); }); return; }
      var m2 = /^(.*\s)(\S+)\/(\S+)$/.exec(p);
      if (m2 && !/etw|jd[nm]/.test(m2[2] + m2[3])){ out.push(m2[1] + m2[2], m2[1] + m2[3]); return; }
      out.push(p);
    });
  });

  out.slice().forEach(function(p){ if (/^sich /.test(p)) out.push(p.slice(5)); if (/ sein$/.test(p)) out.push(p.slice(0, -5)); });

function checkDe(input, de){
  var T = deTeile(de), ganz = normDe(input);
  if (!ganz) return false;
  if (T.indexOf(ganz) >= 0) return true;
  var teile = String(input).split(/[,;]/).map(normDe).filter(Boolean);
  return teile.length > 0 && teile.every(function(p){ return T.indexOf(p) >= 0; });
}

var S = leer();
function uebernehmen(o){
  var n = leer(); if (!o || typeof o !== 'object') return n;
  if (o.cards && typeof o.cards === 'object') n.cards = o.cards;
  if (Array.isArray(o.sel)) n.sel = o.sel;

/* Zwei Stände zusammenführen: pro Karte gewinnt die zuletzt abgefragte. Gibt true zurück, wenn sich S geändert hat. */
function mischen(o){
  o = uebernehmen(o); var vorher = JSON.stringify(S);
  var reset = Math.max(S.reset, o.reset);
  var cards = {};
  [S.cards, o.cards].forEach(function(src){ Object.keys(src).forEach(function(id){
    var a = src[id]; if (!Array.isArray(a) || (a[2]||0) < reset) return;
    if (!cards[id] || (cards[id][2]||0) < (a[2]||0)) cards[id] = a;
  }); });
  var own = {};
  S.own.concat(o.own).forEach(function(w){ if (w && w.id && (!own[w.id] || (own[w.id].t||0) < (w.t||0))) own[w.id] = w; });
  if (o.t > S.t){ S.set = o.set; S.sel = o.sel; S.art = o.art; }
  if (o.tage.last > S.tage.last || (o.tage.last === S.tage.last && o.tage.serie > S.tage.serie)) S.tage = o.tage;
  S.cards = cards; S.reset = reset;
  S.own = Object.keys(own).map(function(k){ return own[k]; });
  return JSON.stringify(S) !== vorher;
}

    var db = r[0], user = r[1]; if (!db || !user) return;

    });

    var sec = nach[o.sec];
    if (!sec){ sec = nach.eigen; if (!sec){ sec = nach.eigen = { key:'eigen', gruppe:'Eigene Wörter', titel:'Meine Liste', voll:true, eigen:true, cards:[] }; SECS.push(sec); } }
    einfuegen(sec, { id:o.id, sec:sec.key, fr:o.fr, de:o.de, acc:variants(o.fr), satz:null, loes:null, extra:false, own:true });

function zaehlt(c){ return S.set.extra || !c.extra; }

function uebersicht(list){
  var t = today(), o = { n:list.length, fach:[0,0,0,0,0,0,0], due:[0,0,0,0,0,0,0], faellig:0, neu:0, naechste:0, naechsteN:0 };
  list.forEach(function(c){
    var s = stand(c), p = s ? s[0] : 0; o.fach[p]++;
    if (!s) o.neu++;

/* ----- Runden mit Abfrage: Karteikasten, Schreiben, Hören, Vokabeltest ----- */
function eintrag(c, extra){

  if (R.art === 'hoeren') it.dir = 'hoer';
  else { it.dir = richtung(c); if (it.dir === 'fr-de' && !deTippbar(c) && !(R.art === 'kasten' && S.set.modus === 'aufdecken')) it.dir = 'de-fr'; }
  if (extra) for (k in extra) it[k] = extra[k];

}
function rundeStart(artId, opt){
  opt = opt || {};

  R = { art:artId, q:q, i:0, gesamt:0, fertig:0, richtig:0, daneben:[], erg:[], info:'' };
  if (artId === 'kasten'){
    if (opt.nurFaellig) p = CARDS.filter(zaehlt);
    var due = p.filter(function(c){ return faellig(c, t); }), neu = opt.nurFaellig ? [] : p.filter(function(c){ return !stand(c); });
    if (S.set.folge === 'zufall'){ shuffle(due); shuffle(neu); }
    neu = neu.slice(0, S.set.neu);
    due.forEach(function(c){ q.push(eintrag(c)); });
    for (var i=0;i<neu.length;i+=4){
      var g = neu.slice(i, i+4);
      g.forEach(function(c){ q.push({ c:c, art:'neu' }); });
      (S.set.folge === 'zufall' ? shuffle(g.slice()) : g).forEach(function(c){ q.push(eintrag(c, { neu:true })); });
    }
    gesamt = due.length + neu.length;
  } else {
    var l = opt.karten ? p.slice() : reihe(p);
    l.forEach(function(c){ q.push(eintrag(c)); });
    gesamt = l.length;
    R.info = artId === 'test' ? 'Auswertung erst am Ende' : 'Freies Üben';
  }
  if (!q.length){ toast('Dafür gibt es gerade keine Wörter.'); return; }

}
function werten(it, ok){
  var c = it.c, t = today();
  if (it.erst){
    if (R.art === 'kasten'){
      var alt = stand(c); it.alt = alt ? alt.slice() : null;
      var s = alt ? alt.slice() : [0,0,0,0,0];
      if (ok){ var p = it.neu ? 1 : Math.min(6, s[0] + 1); s = [p, p >= 6 ? 0 : t + INT[p], Date.now(), (s[3]||0) + 1, s[4]||0]; }
      else s = [1, t + 1, Date.now(), s[3]||0, (s[4]||0) + 1];
      S.cards[c.id] = s;
    }
    if (ok) R.richtig++; else R.daneben.push(c);
    if (S.tage.last !== t){ S.tage = { last:t, serie:(S.tage.last === t - 1 ? S.tage.serie + 1 : 1) }; }
    speichern();
  }
  if (ok) R.fertig++;
  else { it.nochmal = { c:c, art:'test', erst:false, dir:it.dir }; R.q.splice(Math.min(R.i + 4, R.q.length), 0, it.nochmal); }
  it.ok = ok;
}
function dochRichtig(it){
  var k = R.q.indexOf(it.nochmal); if (k >= 0) R.q.splice(k, 1);
  if (it.erst){
    if (R.art === 'kasten'){ if (it.alt) S.cards[it.c.id] = it.alt; else delete S.cards[it.c.id]; }
    var d = R.daneben.indexOf(it.c); if (d >= 0) R.daneben.splice(d, 1);
